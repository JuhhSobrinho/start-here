<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="1.5; url=View/index.html" />
    <title>Começa Aqui</title>
    <script>
      (function () {
        var tema = localStorage.getItem("tema");
        if (tema === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="View/style.css" />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }

      .splash-conteudo {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .splash-logo-icone {
        color: var(--cor-principal);
        margin-bottom: 24px;
      }
    </style>
    <script>
      setTimeout(function () {
        window.location.replace("View/index.html");
      }, 1500);
    </script>
  </head>
  <body class="pagina-inicial">
    <div class="splash-conteudo">
      <svg class="splash-logo-icone" viewBox="0 0 40 40" width="56" height="56" aria-hidden="true">
        <path d="M20 2 L35 11 L35 29 L20 38 L5 29 L5 11 Z" fill="currentColor" />
        <path d="M24 14a8 8 0 1 0 0 12" stroke="var(--home-bg)" stroke-width="3" fill="none" stroke-linecap="round" />
      </svg>
      <h1 class="hero-titulo">começa <span class="hero-titulo-destaque">aqui</span></h1>
    </div>
  </body>
</html>
